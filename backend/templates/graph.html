<!DOCTYPE html>
<html>
<head>
<title>Skill Match Analysis</title>

<style>

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #141e30, #243b55);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.card {
    width: 750px;
    padding: 50px;
    border-radius: 20px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    text-align: center;
    color: white;
}

h2 {
    margin-bottom: 50px;
    letter-spacing: 1px;
}

.ring-wrapper {
    display: flex;
    justify-content: space-around;
    align-items: center;
}

.ring {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* animation start state */
.matched-ring,
.missing-ring{
    background: conic-gradient(#2c3e50 0%, #2c3e50 100%);
}

/* glow */
.matched-ring{
    box-shadow: 0 0 30px #00ff9d;
}

.missing-ring{
    box-shadow: 0 0 30px #ff4b5c;
}

.inner-circle {
    width: 160px;
    height: 160px;
    background: #1f2a38;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-size: 26px;
    font-weight: bold;
}

.label {
    margin-top: 15px;
    font-size: 16px;
    letter-spacing: 1px;
}

.btn {
    margin-top: 60px;
    padding: 12px 30px;
    background: linear-gradient(90deg, #00ff9d, #00c3ff);
    border-radius: 30px;
    color: black;
    font-weight: bold;
    text-decoration: none;
    display: inline-block;
}

.btn:hover {
    opacity: 0.85;
}

</style>
</head>

<body>

<div class="card">

<h2>AI Skill Match Report</h2>

<div class="ring-wrapper">

<!-- Matched -->
<div>
    <div class="ring matched-ring" id="matchRing">
        <div class="inner-circle" id="matchText">
            0%
        </div>
    </div>
    <div class="label">Matched Skills</div>
</div>

<!-- Missing -->
<div>
    <div class="ring missing-ring" id="missingRing">
        <div class="inner-circle" id="missingText">
            0%
        </div>
    </div>
    <div class="label">Missing Skills</div>
</div>

</div>

<a href="/" class="btn">Back to Home</a>

</div>

<script>

let percentage = {{ percentage }};
let missing = 100 - percentage;

let matchRing = document.getElementById("matchRing");
let missingRing = document.getElementById("missingRing");

let matchText = document.getElementById("matchText");
let missingText = document.getElementById("missingText");

let count = 0;

let interval = setInterval(() => {

    if(count <= percentage){

        matchRing.style.background =
        `conic-gradient(#00ff9d ${count}%, #2c3e50 ${count}%)`;

        matchText.innerHTML = count + "%";
    }

    if(count <= missing){

        missingRing.style.background =
        `conic-gradient(#ff4b5c ${count}%, #2c3e50 ${count}%)`;

        missingText.innerHTML = count + "%";
    }

    count++;

    if(count > 100){
        clearInterval(interval);
    }

}, 20);

</script>

</body>
</html>
